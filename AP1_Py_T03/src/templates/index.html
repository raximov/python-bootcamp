<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Krestiklar va Noliklar</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>
    <table id="board">
      <tr>
        <td data-i="0" data-j="0"></td>
        <td data-i="0" data-j="1"></td>
        <td data-i="0" data-j="2"></td>
      </tr>
      <tr>
        <td data-i="1" data-j="0"></td>
        <td data-i="1" data-j="1"></td>
        <td data-i="1" data-j="2"></td>
      </tr>
      <tr>
        <td data-i="2" data-j="0"></td>
        <td data-i="2" data-j="1"></td>
        <td data-i="2" data-j="2"></td>
      </tr>
    </table>
    <div id="controls">
      <button id="restartButton">O'yinni qayta boshlash</button>
      <p id="message"></p>
    </div>
  </div>
  <script src="/static/js/game.js"></script>
</body>
</html>
